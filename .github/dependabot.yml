# What Dependabot watches here, and why the obvious entry is missing.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The workflows are dependencies too, and the one this repository has runs
  # with permission to read the whole of it. A pinned action that is never
  # updated is the part of the supply chain nobody looks at.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
# **There is deliberately no entry for this repository's own packages.**
#
# The lockfile is `bun.lock` at `lockfileVersion: 2`, written by bun 1.4.2, and
# the bun Dependabot runs reads up to version 1:
#
#     Dependabot::DependencyFileNotSupported
#     Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock.
#     The bun version Dependabot runs supports up to 1.
#
# So `package-ecosystem: 'bun'` fails on every run rather than opening pull
# requests, which is a red check that says nothing and trains people to ignore
# red checks.
#
# `npm` is not the workaround. It would read `package.json`, ignore `bun.lock`
# or write a lockfile of a different kind, and a dependency bump would then
# install something nobody resolved — a worse outcome than no automation.
#
# Add the bun entry when Dependabot reads lockfile version 2, and not before.
# Until then dependency updates here are somebody's decision rather than a bot's.
