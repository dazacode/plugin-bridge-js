# What Dependabot watches here, and why each entry is the one it is.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # `bun`, not `npm`. This repository's lockfile is `bun.lock` and its
  # `packageManager` is bun 1.4.2; the npm ecosystem would read `package.json`
  # and then either ignore the lockfile or write one of a different kind, which
  # is how a dependency bump turns into a build that installs something nobody
  # resolved. Bun's own ecosystem needs the text lockfile bun 1.1.39 introduced,
  # which is what is committed here.
  #
  # One entry at the root covers the workspace: `workspaces: ['packages/*']` is
  # resolved from here, and a directory per package would produce six pull
  # requests for one shared dependency.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

  # The workflows are dependencies too, and the one this repository has runs
  # with permission to read the whole of it. A pinned action that is never
  # updated is the part of the supply chain nobody looks at.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
